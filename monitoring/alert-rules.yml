groups:
  - name: taskflow-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[2m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on TaskFlow API"

      - alert: AppDown
        expr: up{job="taskflow-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "TaskFlow API is down"